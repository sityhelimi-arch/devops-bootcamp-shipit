name: deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: launchpad/package-lock.json

      - name: Install dependencies
        run: npm clean-install
        working-directory: launchpad

      - name: Run pre-flight test
        run: npm run test
        working-directory: launchpad

      - name: Report status
       run: bash scripts/report.sh
        env:
          BOARD_URL: ${{ vars.BOARD_URL }}
          SHIPIT_TOKEN: ${{ secrets.SHIPIT_TOKEN }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: launchpad/package-lock.json

      - name: Install dependencies
        run: npm clean-install
        working-directory: launchpad

      - name: Build project
        run: npm run build
        working-directory: launchpad
        env:
          VITE_BOARD_URL: ${{ vars.BOARD_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: launchpad/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
